<div class="pui-es" [class]="'pui-es pui-es--' + size">
  <div class="pui-es__icon">
    <pui-icon-internal [name]="icon" size="xl"></pui-icon-internal>
  </div>

  <h3 class="pui-es__title" *ngIf="title">{{ title }}</h3>
  <p class="pui-es__desc" *ngIf="description">{{ description }}</p>

  <div class="pui-es__actions">
    <ng-content select="[actions]"></ng-content>
  </div>

  <ng-content></ng-content>
</div>
