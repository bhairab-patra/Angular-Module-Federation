<aside class="ssb"
       [class.ssb--collapsed]="collapsed"
       [class.ssb--hidden]="!showSidebar"
       [ngStyle]="cssVars">

  <!-- Header -->
  <div class="ssb__header">
    <div class="ssb__brand" *ngIf="!collapsed">
      <span class="ssb__logo">
        <img *ngIf="logoUrl" [src]="logoUrl" width="28" height="28" [alt]="brandName" class="ssb__logo-img" />
        <span *ngIf="!logoUrl" [innerHTML]="logo || defaultLogo"></span>
      </span>
      <span class="ssb__brand-name">{{ brandName }}</span>
    </div>
    <button class="ssb__toggle" (click)="toggle()" [title]="collapsed ? 'Expand' : 'Collapse'">
      <svg *ngIf="!collapsed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      <svg *ngIf="collapsed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>

  <!-- Logo-only row when collapsed -->
  <div class="ssb__logo-only" *ngIf="collapsed">
    <span class="ssb__logo">
      <img *ngIf="logoUrl" [src]="logoUrl" width="28" height="28" [alt]="brandName" class="ssb__logo-img" />
      <span *ngIf="!logoUrl" [innerHTML]="logo || defaultLogo"></span>
    </span>
  </div>

  <!-- Navigation -->
  <nav class="ssb__nav">
    <div class="ssb__group" *ngFor="let group of groups">

      <div class="ssb__group-label" *ngIf="group.label && !collapsed">
        {{ group.label }}
      </div>

      <ul class="ssb__list">
        <li *ngFor="let item of group.items">
          <button class="ssb__item"
                  [class.ssb__item--active]="activeId === item.id"
                  [class.ssb__item--disabled]="item.disabled"
                  (click)="select(item)"
                  (mouseenter)="onNavItemEnter(item, $event)"
                  (mouseleave)="onNavItemLeave()">

            <!-- Icon via platform-ui icon name -->
            <span class="ssb__icon" *ngIf="item.iconName">
              <pui-lib-icon [name]="item.iconName" size="sm" color="currentColor"></pui-lib-icon>
            </span>
            <!-- Icon via raw SVG string fallback -->
            <span class="ssb__icon" *ngIf="!item.iconName && item.icon" [innerHTML]="item.icon"></span>
            <!-- Collapsed fallback for text-only items: show initial letter as icon -->
            <span class="ssb__abbr" *ngIf="collapsed && !item.iconName && !item.icon">{{ itemAbbr(item) }}</span>

            <!-- Label: only in expanded -->
            <ng-container *ngIf="!collapsed">
              <pui-lib-tooltip *ngIf="needsEllipsis(item.label); else plainLabel"
                                class="ssb__label-tt"
                                [text]="item.label"
                                position="right">
                <span class="ssb__label">{{ item.label }}</span>
              </pui-lib-tooltip>
              <ng-template #plainLabel>
                <span class="ssb__label">{{ item.label }}</span>
              </ng-template>
            </ng-container>
          </button>
        </li>
      </ul>

    </div>
  </nav>

  <!-- User profile + menu -->
  <div class="ssb__user-wrap" *ngIf="showUser">

    <!-- User menu popup (shown above the profile strip) -->
    <div class="ssb__user-menu" *ngIf="userMenuOpen && userMenuItems.length">
      <div *ngFor="let item of userMenuItems">
        <div class="ssb__user-menu-divider" *ngIf="item.divider"></div>
        <button class="ssb__user-menu-item"
                [class.ssb__user-menu-item--disabled]="item.disabled"
                (click)="selectUserMenuItem(item, $event)">
          <span class="ssb__user-menu-icon" *ngIf="item.iconName">
            <pui-lib-icon [name]="item.iconName" size="sm" color="currentColor"></pui-lib-icon>
          </span>
          <span class="ssb__user-menu-icon" *ngIf="!item.iconName && item.icon" [innerHTML]="item.icon"></span>
          <span class="ssb__user-menu-label">{{ item.label }}</span>
        </button>
      </div>
    </div>

    <!-- Profile strip -->
    <div class="ssb__user"
         [class.ssb__user--clickable]="userMenuItems.length"
         [class.ssb__user--open]="userMenuOpen"
         (click)="toggleUserMenu($event)">
      <div class="ssb__avatar">
        <img *ngIf="userAvatarUrl" [src]="userAvatarUrl" [alt]="userName" class="ssb__avatar-img" />
        <span *ngIf="!userAvatarUrl" class="ssb__avatar-initials">{{ avatarInitials }}</span>
      </div>
      <div class="ssb__user-info" *ngIf="!collapsed">
        <span class="ssb__user-name">{{ userName }}</span>
        <span class="ssb__user-email">{{ userEmail }}</span>
      </div>
      <svg *ngIf="!collapsed && userMenuItems.length"
           class="ssb__user-arrow"
           [class.ssb__user-arrow--up]="userMenuOpen"
           width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M18 15l-6-6-6 6"/>
      </svg>
      <svg *ngIf="!collapsed && !userMenuItems.length"
           class="ssb__user-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </div>

  </div>


  <!-- Collapsed nav tooltip — rendered outside nav so scrolling still works -->
  <div class="ssb__nav-tooltip" *ngIf="collapsed && hoveredItem" [style.top.px]="tooltipTop">
    {{ hoveredItem!.label }}
  </div>

</aside>
