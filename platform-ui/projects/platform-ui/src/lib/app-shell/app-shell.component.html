<div class="pas">

  <pui-lib-solifi-sidebar
    [brandName]="brandName"
    [logoUrl]="logoUrl"
    [groups]="groups"
    [activeId]="activeId"
    [collapsed]="collapsed"
    [showSidebar]="showSidebar"
    [theme]="theme"
    [showUser]="showUser"
    [userName]="userName"
    [userEmail]="userEmail"
    [userInitials]="userInitials"
    [userAvatarUrl]="userAvatarUrl"
    [userMenuItems]="userMenuItems"
    [width]="width"
    [collapsedWidth]="collapsedWidth"
    (itemSelect)="itemSelect.emit($event)"
    (collapsedChange)="onCollapsedChange($event)"
    (userMenuSelect)="userMenuSelect.emit($event)">
  </pui-lib-solifi-sidebar>

 
  <div class="pas__panel">

    <div class="pas__titlebar" *ngIf="pageTitle">
      <span class="pas__titlebar-accent"></span>
      <span class="pas__titlebar-title">{{ pageTitle }}</span>
      <ng-content select="[title-actions]"></ng-content>
    </div>

    <main class="pas__content">
      <ng-content></ng-content>
    </main>

   
    <footer class="pas__footer" *ngIf="footerText">
      {{ footerText }}
    </footer>

  </div>

</div>
