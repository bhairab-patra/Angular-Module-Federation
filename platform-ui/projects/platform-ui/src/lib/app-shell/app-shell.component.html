<div class="pas">

  <!-- Header -->
  <pui-lib-header
    [appTitle]="appTitle"
    [appSubtitle]="appSubtitle"
    [logoUrl]="logoUrl"
    [bgColor]="headerBgColor"
    [textColor]="headerTextColor"
    [userName]="headerUserName"
    [userEmail]="headerUserEmail"
    [greeting]="headerGreeting"
    [userSubtext]="headerUserSubtext"
    [avatarUrl]="headerAvatarUrl"
    [avatarColor]="headerAvatarColor"
    [avatarTextColor]="headerAvatarTextColor"
    [badge]="headerBadge"
    [showHelp]="headerShowHelp"
    [menuItems]="headerMenuItems"
    [showHamburger]="true"
    [hamburgerOpen]="sidebarVisible"
    (hamburgerToggle)="toggleSidebar()"
    (menuAction)="headerMenuAction.emit($event)"
    (helpClick)="headerHelpClick.emit()">
  </pui-lib-header>

  <!-- Body: sidebar + content -->
  <div class="pas__body">

    <pui-lib-sidebar
      [brandName]="brandName || appTitle"
      [groups]="groups"
      [activeId]="activeId"
      [collapsed]="sidebarCollapsed"
      [showSidebar]="sidebarVisible"
      [config]="config"
      [theme]="theme"
      [bgColor]="sidebarBgColor"
      [textColor]="sidebarTextColor"
      [activeColor]="sidebarActiveColor"
      [hoverColor]="sidebarHoverColor"
      [borderColor]="sidebarBorderColor"
      [width]="sidebarWidth"
      (collapsedChange)="onCollapsedChange($event)"
      (itemSelect)="itemSelect.emit($event)">
    </pui-lib-sidebar>

    <main class="pas__content">
      <ng-content></ng-content>
    </main>

  </div>
</div>
