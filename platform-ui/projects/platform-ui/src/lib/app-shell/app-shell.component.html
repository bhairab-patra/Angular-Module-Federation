<div class="pas">

  <pui-solifi-sidebar-internal
    [brandName]="sidebarBrandName"
    [logoUrl]="sidebarLogoUrl"
    [showBrand]="showSidebarBrand"
    [groups]="sidebarGroups"
    [activeId]="sidebarActiveId"
    [collapsed]="sidebarCollapsed"
    [showSidebar]="showSidebar"
    [theme]="sidebarTheme"
    [showUser]="showSidebarUser"
    [userName]="sidebarUserName"
    [userEmail]="sidebarUserEmail"
    [userInitials]="sidebarUserInitials"
    [userAvatarUrl]="sidebarUserAvatarUrl"
    [userMenuItems]="sidebarUserMenuItems"
    [width]="sidebarWidth"
    [collapsedWidth]="sidebarCollapsedWidth"
    (itemSelect)="sidebarItemSelect.emit($event)"
    (collapsedChange)="onSidebarCollapsedChange($event)"
    (userMenuSelect)="sidebarUserMenuSelect.emit($event)">
  </pui-solifi-sidebar-internal>


  <div class="pas__panel">
    <pui-header-internal
      *ngIf="showHeader"
      [appTitle]="headerAppTitle"
      [appSubtitle]="headerAppSubtitle"
      [logoUrl]="headerLogoUrl"
      [logoText]="headerLogoText"
      [bgColor]="headerBgColor"
      [textColor]="headerTextColor"
      [showLogo]="showHeaderLogo"
      [showHeading]="showHeaderHeading"
      [showSearch]="showHeaderSearch"
      [showUser]="showHeaderUser"
      [avatarMode]="headerAvatarMode"
      [userName]="headerUserName"
      [userEmail]="headerUserEmail"
      [avatarUrl]="headerAvatarUrl"
      [avatarColor]="headerAvatarColor"
      [avatarTextColor]="headerAvatarTextColor"
      [menuItems]="headerMenuItems"
      [badge]="headerBadge"
      (searchQuery)="headerSearchQuery.emit($event)"
      (menuAction)="headerMenuAction.emit($event)">
    </pui-header-internal>

    <div class="pas__titlebar" *ngIf="pageTitle">
      <span class="pas__titlebar-accent"></span>
      <span class="pas__titlebar-title">{{ pageTitle }}</span>
      <ng-content select="[title-actions]"></ng-content>
    </div>

    <main class="pas__content" [style.paddingBottom.px]="footerReservedHeight || null">
      <ng-content></ng-content>
    </main>


    <footer class="pas__footer" *ngIf="footerText && !showFooter">
      {{ footerText }}
    </footer>

    <pui-footer-internal
      #footerEl
      *ngIf="showFooter"
      [variant]="footerVariant"
      [noticeSlides]="footerNoticeSlides"
      [activeSlideIndex]="footerActiveSlideIndex"
      [copyrightText]="footerCopyrightText"
      [links]="footerLinks"
      [poweredByText]="footerPoweredByText"
      [showPoweredBy]="showFooterPoweredBy"
      [stickyBottom]="footerStickyBottom"
      (activeSlideIndexChange)="onFooterActiveSlideIndexChange($event)"
      (linkClick)="footerLinkClick.emit($event)"
      (contactClick)="footerContactClick.emit($event)">
    </pui-footer-internal>

  </div>

</div>
