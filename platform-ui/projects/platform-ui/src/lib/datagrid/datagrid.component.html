<div class="pui-dg-wrap">
  <div class="pui-dg-inner">
    <div class="pui-dg-toolbar" *ngIf="heading">
      <div class="pui-dg-toolbar__left">
        <span class="pui-dg-toolbar__title">{{ heading }}</span>
      </div>
      <div class="pui-dg-toolbar__right">
        <ng-content select="[tableActions]"></ng-content>
      </div>
    </div>

    <div class="pui-dg-scroll">
      <table class="pui-dg">
        <thead>
          <tr>
            <th *ngIf="selectable" class="pui-dg__th pui-dg__th--check">
              <input
                type="checkbox"
                class="pui-dg__check"
                [checked]="allSelected"
                (change)="toggleAll($event)"
              />
            </th>
            <th
              *ngFor="let col of columns"
              class="pui-dg__th"
              [class.pui-dg__th--sortable]="col.sortable"
              [class.pui-dg__th--sorted]="sort?.field === col.field"
              [style.width]="col.width"
              [style.text-align]="col.align || 'left'"
              (click)="col.sortable && doSort($any(col.field))"
            >
              {{ col.header }}
              <span *ngIf="col.sortable" class="pui-dg__sort-icon">
                <svg
                  *ngIf="sort?.field !== col.field"
                  width="10"
                  height="10"
                  viewBox="0 0 10 10"
                  fill="none"
                >
                  <path
                    d="M5 1v8M2 4l3-3 3 3M2 7l3 3 3-3"
                    stroke="var(--pui-neutral-400)"
                    stroke-width="1.2"
                    stroke-linecap="round"
                  />
                </svg>
                <svg
                  *ngIf="sort?.field === col.field && sort?.dir === 'asc'"
                  width="10"
                  height="10"
                  viewBox="0 0 10 10"
                  fill="none"
                >
                  <path
                    d="M5 9V1M2 4l3-3 3 3"
                    stroke="var(--pui-brand-hover)"
                    stroke-width="1.4"
                    stroke-linecap="round"
                  />
                </svg>
                <svg
                  *ngIf="sort?.field === col.field && sort?.dir === 'desc'"
                  width="10"
                  height="10"
                  viewBox="0 0 10 10"
                  fill="none"
                >
                  <path
                    d="M5 1v8M2 7l3 3 3-3"
                    stroke="var(--pui-brand-hover)"
                    stroke-width="1.4"
                    stroke-linecap="round"
                  />
                </svg>
              </span>
            </th>
          </tr>
        </thead>

        <tbody>
          <tr *ngIf="!pagedRows.length">
            <td
              [attr.colspan]="columns.length + (selectable ? 1 : 0)"
              class="pui-dg__empty"
            >
              {{ emptyText }}
            </td>
          </tr>

          <tr
            *ngFor="let row of pagedRows; let i = index"
            class="pui-dg__row"
            [class.pui-dg__row--selected]="isSelected(row)"
            (click)="rowClick.emit(row)"
          >
            <td *ngIf="selectable" class="pui-dg__td pui-dg__td--check">
              <input
                type="checkbox"
                class="pui-dg__check"
                [checked]="isSelected(row)"
                (change)="toggleRow(row, $event)"
              />
            </td>

            <td
              *ngFor="let col of columns"
              class="pui-dg__td"
              [style.text-align]="col.align || 'left'"
            >
              <ng-container *ngIf="col.type === 'badge' && col.badgeMap">
                <span
                  class="pui-dg__badge"
                  [class.pui-dg__badge--default]="
                    !getBadgeStyle(col, row)['background']
                  "
                  [ngStyle]="getBadgeStyle(col, row)"
                >
                  {{ getBadgeLabel(col, row) }}
                </span>
              </ng-container>

              <ng-container *ngIf="col.type === 'number'">
                {{ row[col.field] | number }}
              </ng-container>

              <ng-container *ngIf="col.type === 'date'">
                {{ row[col.field] | date }}
              </ng-container>

              <ng-container *ngIf="!col.type || col.type === 'text'">
                {{ row[col.field] }}
              </ng-container>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div *ngIf="paginate" class="pui-dg-footer">
    <span class="pui-dg-footer__info">
      {{ pageStart }}–{{ pageEnd }} of {{ sortedRows.length }} rows
    </span>
    <pui-lib-simple-pagination
      [total]="sortedRows.length"
      [page]="currentPage"
      [pageSize]="pageSize"
      (pageChange)="goPage($event)"
    >
    </pui-lib-simple-pagination>
  </div>
</div>
