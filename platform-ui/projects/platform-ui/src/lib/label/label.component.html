<span class="pui-label">
  <span class="pui-label__text">
    {{ text }}<span *ngIf="required" class="pui-label__req">*</span>
  </span>

  <pui-tooltip-internal
    *ngIf="showInfo && info"
    class="pui-label__info"
    [text]="info"
    [position]="infoPosition">
    <pui-icon-internal name="info" size="xs"></pui-icon-internal>
  </pui-tooltip-internal>
</span>
