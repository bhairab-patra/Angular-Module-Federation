<aside
  class="pui-sb"
  [class.pui-sb--collapsed]="collapsed"
  [class.pui-sb--hidden]="!showSidebar"
  [ngStyle]="cssVars"
>
  <div class="pui-sb__brand">
    <div class="pui-sb__logo-wrap">
      <span class="pui-sb__logo" [innerHTML]="logo || defaultLogo"></span>
      <span class="pui-sb__brand-name" *ngIf="!collapsed && brandName">{{ brandName }}</span>
    </div>
    <button
      *ngIf="cfg.collapsible && !collapsed"
      class="pui-sb__toggle"
      (click)="toggleCollapse()"
      title="Collapse sidebar"
    >
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
      >
        <path d="M15 18l-6-6 6-6" />
      </svg>
    </button>
  </div>

  <div class="pui-sb__search" *ngIf="cfg.showSearch && !collapsed">
    <pui-lib-search-internal
      size="sm"
      placeholder="Search menu…"
      [debounce]="200"
      [clearable]="true"
      (searchChange)="onSearch($event)"
      (cleared)="onSearch('')"
    >
    </pui-lib-search-internal>
  </div>

  <nav class="pui-sb__nav">
    <div class="pui-sb__group" *ngFor="let group of displayGroups">
      <div class="pui-sb__group-label" *ngIf="group.label && !collapsed">
        {{ group.label }}
      </div>

      <ul class="pui-sb__list">
        <li
          *ngFor="let item of group.items"
          class="pui-sb__li"
          [class.pui-sb__li--divider]="item.dividerAfter"
        >
          <button
            class="pui-sb__item"
            [class.pui-sb__item--active]="activeId === item.id"
            [class.pui-sb__item--disabled]="item.disabled"
            [title]="collapsed ? item.label : needsEllipsis(item.label) ? item.label : ''"
            (click)="clickItem(item)"
          >
            <span
              *ngIf="showIcons"
              class="pui-sb__item-icon"
              [innerHTML]="item.icon || defaultIcon"
            ></span>

            <span class="pui-sb__item-body" *ngIf="!collapsed">
              <span
                class="pui-sb__item-label"
                [innerHTML]="highlight(item.label)"
                [class.pui-sb__item-label--ellipsis]="needsEllipsis(item.label)"
              >
              </span>
              <span
                *ngIf="item.badge !== undefined"
                class="pui-sb__badge"
                [ngClass]="'pui-sb__badge--' + (item.badgeVariant || 'primary')"
              >
                {{ item.badge }}
              </span>
            </span>

            <span
              *ngIf="item.children?.length && !collapsed"
              class="pui-sb__arrow"
              [class.pui-sb__arrow--open]="openIds.has(item.id)"
            >
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
              >
                <path d="M9 18l6-6-6-6" />
              </svg>
            </span>
          </button>

          <ul
            class="pui-sb__sub"
            [class.pui-sb__sub--open]="openIds.has(item.id) && !collapsed"
            [style.maxHeight.px]="
              openIds.has(item.id) && !collapsed ? item.children!.length * 36 : 0
            "
            *ngIf="item.children?.length"
          >
            <li *ngFor="let child of item.children">
              <button
                class="pui-sb__subitem"
                [class.pui-sb__subitem--active]="activeId === child.id"
                [class.pui-sb__subitem--disabled]="child.disabled"
                [title]="needsEllipsis(child.label) ? child.label : ''"
                (click)="clickItem(child)"
              >
                <span class="pui-sb__subitem-dot"></span>
                <span
                  class="pui-sb__subitem-label"
                  [innerHTML]="highlight(child.label)"
                  [class.pui-sb__item-label--ellipsis]="needsEllipsis(child.label)"
                >
                </span>
                <span
                  *ngIf="child.badge !== undefined"
                  class="pui-sb__badge"
                  [ngClass]="'pui-sb__badge--' + (child.badgeVariant || 'primary')"
                >
                  {{ child.badge }}
                </span>
              </button>
            </li>
          </ul>
        </li>
      </ul>
    </div>

    <div class="pui-sb__empty" *ngIf="displayGroups.length === 0 && searchQuery">
      <svg
        width="28"
        height="28"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
      >
        <circle cx="11" cy="11" r="7" />
        <path d="M21 21l-4-4" />
      </svg>
      <span>No results for "{{ searchQuery }}"</span>
    </div>
  </nav>

  <div class="pui-sb__user" *ngIf="showUser && !collapsed">
    <div class="pui-sb__user-avatar">
      <img *ngIf="userAvatarUrl" [src]="userAvatarUrl" [alt]="userName" class="pui-sb__user-img" />
      <span *ngIf="!userAvatarUrl" class="pui-sb__user-initials">{{ avatarInitials }}</span>
    </div>
    <div class="pui-sb__user-info">
      <span class="pui-sb__user-name">{{ userName }}</span>
      <span class="pui-sb__user-email">{{ userEmail }}</span>
    </div>
    <svg
      class="pui-sb__user-arrow"
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
    >
      <path d="M9 18l6-6-6-6" />
    </svg>
  </div>

  <div
    class="pui-sb__user pui-sb__user--collapsed"
    *ngIf="showUser && collapsed"
    title="{{ userName }}"
  >
    <div class="pui-sb__user-avatar">
      <img *ngIf="userAvatarUrl" [src]="userAvatarUrl" [alt]="userName" class="pui-sb__user-img" />
      <span *ngIf="!userAvatarUrl" class="pui-sb__user-initials">{{ avatarInitials }}</span>
    </div>
  </div>

  <div class="pui-sb__footer" *ngIf="!showUser || cfg.collapsible">
    <button
      *ngIf="cfg.collapsible && collapsed"
      class="pui-sb__expand-btn"
      (click)="toggleCollapse()"
      title="Expand sidebar"
    >
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
      >
        <path d="M9 18l6-6-6-6" />
      </svg>
    </button>
    <ng-content select="[sidebar-footer]"></ng-content>
  </div>
</aside>
