<div class="pui-pg" [class.pui-pg--compact]="compact">

  <span *ngIf="!compact" class="pui-pg__info">
    <ng-container *ngIf="total === 0">No {{ itemLabel }}</ng-container>
    <ng-container *ngIf="total > 0">
      Showing {{ startItem }}&ndash;{{ endItem }} of {{ total }} {{ itemLabel }}
    </ng-container>
  </span>

  <div *ngIf="showPageSizeSelector && !compact" class="pui-pg__size-wrap">
    <label class="pui-pg__size-label">Per page</label>
    <select class="pui-pg__size-select" [value]="pageSize" (change)="onPageSizeChange($event)">
      <option *ngFor="let opt of pageSizeOptions" [value]="opt">{{ opt }}</option>
    </select>
  </div>

  <nav class="pui-pg__nav" aria-label="Pagination navigation">

    <button *ngIf="showFirstLast"
            type="button" class="pui-pg__btn pui-pg__btn--icon"
            [disabled]="page <= 1" aria-label="First page"
            (click)="goTo(1)">
      <pui-lib-icon name="skip-left" size="sm"></pui-lib-icon>
    </button>

    <button type="button" class="pui-pg__btn pui-pg__btn--icon"
            [disabled]="page <= 1" aria-label="Previous page"
            (click)="goTo(page - 1)">
      <pui-lib-icon name="chevron-left" size="sm"></pui-lib-icon>
    </button>

    <ng-container *ngFor="let p of pages; trackBy: trackPage">
      <span *ngIf="isEllipsis(p)" class="pui-pg__ellipsis" aria-hidden="true">&hellip;</span>
      <button *ngIf="!isEllipsis(p)"
              type="button"
              class="pui-pg__btn pui-pg__btn--num"
              [class.pui-pg__btn--active]="p === page"
              [attr.aria-current]="p === page ? 'page' : null"
              (click)="goTo(+p)">{{ p }}</button>
    </ng-container>

    <button type="button" class="pui-pg__btn pui-pg__btn--icon"
            [disabled]="page >= totalPages" aria-label="Next page"
            (click)="goTo(page + 1)">
      <pui-lib-icon name="chevron-right" size="sm"></pui-lib-icon>
    </button>

    <button *ngIf="showFirstLast"
            type="button" class="pui-pg__btn pui-pg__btn--icon"
            [disabled]="page >= totalPages" aria-label="Last page"
            (click)="goTo(totalPages)">
      <pui-lib-icon name="skip-right" size="sm"></pui-lib-icon>
    </button>

  </nav>
</div>
