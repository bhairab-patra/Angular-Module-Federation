<header class="topbar" *ngIf="!isHome" [class.topbar--collapsed]="sidebarCollapsed">
  <div class="topbar-left">
    <div class="topbar-version">
      <span class="version-badge">platform-ui 1.1.12</span>
      <span class="version-sep"></span>
      <span class="version-label">
        <span class="version-dot"></span>
        Stable
      </span>
    </div>
  </div>
  <div class="topbar-center" *ngIf="!isHome">
    <div class="search-wrap" [class.search-wrap--open]="suggestions.length > 0">
      <span class="search-icon">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none">
          <circle cx="9" cy="9" r="6" stroke="#9ca3af" stroke-width="2" />
          <path d="M14 14l3.5 3.5" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" />
        </svg>
      </span>
      <input
        class="search-input"
        type="text"
        placeholder="Search components..."
        [value]="searchQuery"
        (input)="onSearch(asInput($event.target).value)"
        (keydown.escape)="clearSearch()"
        (keydown.arrowdown)="moveFocus(1)"
        (keydown.arrowup)="moveFocus(-1)"
        (keydown.enter)="selectFocused()"
        autocomplete="off"
      />
      <button
        *ngIf="searchQuery"
        class="search-clear"
        (click)="clearSearch()"
        aria-label="Clear search"
      >
        <svg
          width="13"
          height="13"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        >
          <path d="M4 4l8 8M12 4l-8 8" />
        </svg>
      </button>
      <ul class="search-dropdown" *ngIf="suggestions.length > 0">
        <li
          *ngFor="let s of suggestions; let i = index; trackBy: trackByIndex"
          class="search-item"
          [class.search-item--focused]="i === focusedIndex"
          (mousedown)="navigate(s.route)"
          (mouseenter)="focusedIndex = i"
        >
          <span class="search-item__cat">{{ s.category }}</span>
          <span class="search-item__label">{{ s.label }}</span>
        </li>
      </ul>
    </div>
  </div>
  <div class="topbar-right">
    <div class="theme-toggle" role="group" aria-label="Preview theme" *ngIf="!isHome">
      <span
        class="theme-toggle__slider"
        [class.theme-toggle__slider--old]="theme === 'old'"
        aria-hidden="true"
      ></span>
      <button
        type="button"
        class="theme-toggle__btn theme-toggle__btn--new"
        [class.theme-toggle__btn--active]="theme === 'new'"
        [attr.aria-pressed]="theme === 'new'"
        (click)="setTheme('new')"
      >
        <svg
          *ngIf="theme === 'new'"
          class="theme-toggle__check"
          viewBox="0 0 16 16"
          width="11"
          height="11"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M3 8.5l3 3 7-7" />
        </svg>
        <span>solifi-26</span>
      </button>
      <button
        type="button"
        class="theme-toggle__btn theme-toggle__btn--old"
        [class.theme-toggle__btn--active]="theme === 'old'"
        [attr.aria-pressed]="theme === 'old'"
        (click)="setTheme('old')"
      >
        <svg
          *ngIf="theme === 'old'"
          class="theme-toggle__check"
          viewBox="0 0 16 16"
          width="11"
          height="11"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M3 8.5l3 3 7-7" />
        </svg>
        <span>solifi-21</span>
      </button>
    </div>
    <a class="faq-btn" routerLink="/faq" routerLinkActive="faq-btn--active">
      <svg
        width="15"
        height="15"
        viewBox="0 0 16 16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="8" cy="8" r="6.5" />
        <path d="M8 11.5v-.5" />
        <path d="M6.5 6.2a1.5 1.5 0 112 1.5V9" />
      </svg>
      FAQ
    </a>
    <a class="gh-btn" href="https://github.com" target="_blank" rel="noopener">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
        />
      </svg>
      GitHub
    </a>
  </div>
</header>

<div class="shell">
  <pui-lib-solifi-sidebar
    *ngIf="!isHome"
    class="docs-sidebar"
    [groups]="groups"
    [activeId]="activeId"
    [collapsed]="sidebarCollapsed"
    [showBrand]="true"
    [logoUrl]="logoSrc"
    brandName="PlatformUI"
    [customCss]="sidebarLogoCss"
    (logoClick)="navigate('/')"
    (itemSelect)="onNavSelect($event)"
    (collapsedChange)="sidebarCollapsed = $event"
  >
  </pui-lib-solifi-sidebar>

  <main
    class="docs-main"
    [class.docs-main--full]="isHome"
    [class.docs-main--collapsed]="!isHome && sidebarCollapsed"
  >
    <router-outlet></router-outlet>
  </main>
</div>

<pui-lib-toast-container></pui-lib-toast-container>
