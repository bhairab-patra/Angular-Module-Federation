
    <docs-page
      title="Tooltip"
      description="Contextual label shown on hover. Wrap any element with pui-lib-tooltip and set text, position, and variant."
      [code]="code"
      [api]="api">

      <ng-container demo>

        <!-- ── Positions ── -->
        <div class="section-divider"><span class="section-tag">Positions</span></div>
        <div class="position-grid">
          <div class="position-cell">
            <pui-lib-tooltip text="Tooltip on top" position="top">
              <pui-lib-button variant="primary-outline">Top</pui-lib-button>
            </pui-lib-tooltip>
          </div>
          <div class="position-cell">
            <pui-lib-tooltip text="Tooltip on bottom" position="bottom">
              <pui-lib-button variant="primary-outline">Bottom</pui-lib-button>
            </pui-lib-tooltip>
          </div>
          <div class="position-cell">
            <pui-lib-tooltip text="Tooltip on left" position="left">
              <pui-lib-button variant="primary-outline">Left</pui-lib-button>
            </pui-lib-tooltip>
          </div>
          <div class="position-cell">
            <pui-lib-tooltip text="Tooltip on right" position="right">
              <pui-lib-button variant="primary-outline">Right</pui-lib-button>
            </pui-lib-tooltip>
          </div>
        </div>

        <!-- ── Variants ── -->
        <div class="section-divider"><span class="section-tag">Variants</span></div>
        <div class="variant-row">
          <div class="variant-cell">
            <pui-lib-tooltip text="Dark tooltip" position="top" variant="dark">
              <pui-lib-button variant="primary">Dark</pui-lib-button>
            </pui-lib-tooltip>
            <span class="variant-label">dark</span>
          </div>
          <div class="variant-cell">
            <pui-lib-tooltip text="Light tooltip style" position="top" variant="light">
              <pui-lib-button variant="secondary">Light</pui-lib-button>
            </pui-lib-tooltip>
            <span class="variant-label">light</span>
          </div>
          <div class="variant-cell">
            <pui-lib-tooltip text="Teal brand tooltip" position="top" variant="teal">
              <pui-lib-button variant="primary-light">Teal</pui-lib-button>
            </pui-lib-tooltip>
            <span class="variant-label">teal</span>
          </div>
        </div>

        <!-- ── On different triggers ── -->
        <div class="section-divider"><span class="section-tag">On Any Element</span></div>
        <div class="trigger-row">

          <!-- Icon trigger -->
          <pui-lib-card variant="flat" size="sm" style="flex:1">
            <div class="trigger-inner">
              <span class="trigger-label">Icon</span>
              <pui-lib-tooltip text="Download report" position="top">
                <div class="icon-trigger">
                  <pui-lib-icon name="download" size="md" color="#0d6e5f"></pui-lib-icon>
                </div>
              </pui-lib-tooltip>
            </div>
          </pui-lib-card>

          <!-- Badge trigger -->
          <pui-lib-card variant="flat" size="sm" style="flex:1">
            <div class="trigger-inner">
              <span class="trigger-label">Badge</span>
              <pui-lib-tooltip text="3 pending approvals" position="top">
                <pui-lib-badge variant="warning">Pending</pui-lib-badge>
              </pui-lib-tooltip>
            </div>
          </pui-lib-card>

          <!-- Text trigger -->
          <pui-lib-card variant="flat" size="sm" style="flex:1">
            <div class="trigger-inner">
              <span class="trigger-label">Text</span>
              <pui-lib-tooltip text="john.doe@example.com" position="top">
                <span class="dotted-text">Hover for email</span>
              </pui-lib-tooltip>
            </div>
          </pui-lib-card>

          <!-- Disabled button -->
          <pui-lib-card variant="flat" size="sm" style="flex:1">
            <div class="trigger-inner">
              <span class="trigger-label">Disabled button</span>
              <pui-lib-tooltip text="You don't have permission" position="top">
                <pui-lib-button variant="primary" [disabled]="true">Delete</pui-lib-button>
              </pui-lib-tooltip>
            </div>
          </pui-lib-card>

        </div>

        <!-- ── All positions showcase ── -->
        <div class="section-divider"><span class="section-tag">Position Showcase</span></div>
        <pui-lib-card variant="flat" [fullWidth]="true">
          <div class="showcase">
            <pui-lib-tooltip text="Top: appears above" position="top" variant="dark">
              <div class="showcase-dot showcase-dot--top">Top</div>
            </pui-lib-tooltip>
            <div class="showcase-middle-row">
              <pui-lib-tooltip text="Left: appears to the left" position="left" variant="teal">
                <div class="showcase-dot showcase-dot--left">Left</div>
              </pui-lib-tooltip>
              <div class="showcase-center">
                <pui-lib-icon name="info" size="xl" color="#12C6A8"></pui-lib-icon>
                <span class="showcase-hint">Hover the labels</span>
              </div>
              <pui-lib-tooltip text="Right: appears to the right" position="right" variant="teal">
                <div class="showcase-dot showcase-dot--right">Right</div>
              </pui-lib-tooltip>
            </div>
            <pui-lib-tooltip text="Bottom: appears below" position="bottom" variant="dark">
              <div class="showcase-dot showcase-dot--bottom">Bottom</div>
            </pui-lib-tooltip>
          </div>
        </pui-lib-card>

      </ng-container>
    </docs-page>
