<div class="lp-root">
  <div class="lp-hero">
    <!-- Left: copy -->
    <div class="lp-left">
      <h1 class="lp-title">
        PlatformUI<span class="lp-title-accent"> Library </span>
      </h1>
      <p class="lp-sub">
        Production ready components that work seamlessly in Angular, React, or
        plain HTML. Accessible, customizable, and designed to help your team
        ship with confidence.
      </p>
      <div class="lp-actions">
        <button class="lp-btn lp-btn--primary" (click)="goStart()">
          Get started &nbsp;
        </button>
        <button class="lp-btn lp-btn--ghost" (click)="goComponents()">
          Explore components &nbsp;
        </button>
      </div>

      <!-- Feature highlights -->
      <div class="lp-features">
        <div class="lp-feature">
          <span class="lp-feature__icon">
            <svg
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M8 1.5l6 3.2v6.6L8 14.5l-6-3.2V4.7L8 1.5z" />
              <path d="M2 4.7l6 3.2 6-3.2M8 7.9v6.6" />
            </svg>
          </span>
          <span class="lp-feature__text">
            <strong>50+ Components</strong>
            <small>Ready to use</small>
          </span>
        </div>
        <div class="lp-feature">
          <span class="lp-feature__icon">
            <svg
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="8" cy="4.5" r="1.6" />
              <path
                d="M8 6.4V13M2.5 8c2.4 1 8.6 1 11 0M4.2 13.2L8 9.8l3.8 3.4"
              />
            </svg>
          </span>
          <span class="lp-feature__text">
            <strong>WCAG Ready</strong>
            <small>Accessible by default</small>
          </span>
        </div>
        <div class="lp-feature">
          <span class="lp-feature__icon">
            <svg
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M8 1.5l6 3.2-6 3.2-6-3.2 6-3.2z" />
              <path d="M2 8l6 3.2L14 8M2 11.3l6 3.2 6-3.2" />
            </svg>
          </span>
          <span class="lp-feature__text">
            <strong>Framework Agnostic</strong>
            <small>Angular &middot; React &middot; HTML</small>
          </span>
        </div>
      </div>
