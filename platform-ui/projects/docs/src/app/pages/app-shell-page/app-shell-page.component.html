<docs-page
  title="App Shell"
  description="Full application layout using PuiSolifiSidebarComponent — dark navy sidebar, flat navigation, user profile popup menu, icon or text-only mode, collapse to 64px rail. No header required."
  [code]="angularCode"
  [api]="api">

  <ng-container demo>

    <!-- Controls -->
    <div class="demo-controls">
      <div class="ctrl-group">
        <button class="ctrl-chip" [class.active]="iconMode==='with-icons'" (click)="setMode('with-icons')">Icon + text</button>
        <button class="ctrl-chip" [class.active]="iconMode==='no-icons'"   (click)="setMode('no-icons')">Text only</button>
      </div>
      <div class="ctrl-group">
        <button class="ctrl-btn" (click)="onCollapsed(!collapsed)">
          {{ collapsed ? 'Expand' : 'Collapse' }} sidebar
        </button>
      </div>
      <span class="ctrl-tag" *ngIf="lastUserAction">User menu → {{ lastUserAction }}</span>
    </div>

    <!-- Shell frame: sidebar + content side by side, no header -->
    <div class="shell-frame">

      <pui-lib-solifi-sidebar
        brandName="solifi"
        logoUrl="assets/logo.png"
        [groups]="displayGroups"
        [activeId]="activeId"
        [collapsed]="collapsed"
        [theme]="theme"
        [showUser]="true"
        userName="Rosanna Doyle"
        userEmail="rdoyle@solifi.com"
        [userMenuItems]="userMenuItems"
        [width]="210"
        [collapsedWidth]="56"
        (itemSelect)="onNav($event)"
        (collapsedChange)="onCollapsed($event)"
        (userMenuSelect)="onUserMenu($event)">
      </pui-lib-solifi-sidebar>

      <!-- Main content area -->
      <div class="shell-main">

        <!-- Page title bar -->
        <div class="shell-titlebar">
          <span class="shell-titlebar__accent"></span>
          <span class="shell-titlebar__title">{{ activeLabel }}</span>
        </div>

        <!-- Welcome card -->
        <div class="shell-body">
          <div class="welcome-card">
            <div class="welcome-card__text">
              <h2 class="welcome-card__heading">Welcome to<br>the borrower portal!</h2>
              <p class="welcome-card__sub">
                Your Account Manager is:
                <a class="welcome-card__link" href="#">Alan Jasenovic</a>
              </p>
              <p class="welcome-card__meta">You last logged in on Monday, 11 December 2025 12:41</p>
            </div>
            <div class="welcome-card__img-area" aria-hidden="true"></div>
          </div>
        </div>

        <!-- Footer -->
        <div class="shell-footer">Copyright &copy; 2026 Solifi. All Rights Reserved.</div>
      </div>

    </div>

    <!-- Code snippet -->
    <div class="demo-section">
      <div class="demo-section__title">Angular usage</div>
      <pre class="code-block"><code>{{ angularCode }}</code></pre>
    </div>

  </ng-container>

</docs-page>
